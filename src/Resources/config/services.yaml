# yaml-language-server: $schema=../../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire: true
        autoconfigure: true

    BytesCommerce\ZabbixApi\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../Actions/Dto/'
            - '../../Provisioning/Dto/'
            - '../../Provisioning/ValueObject/'
            - '../../Message/'
            - '../../Enums/'

    BytesCommerce\ZabbixApi\ZabbixClientInterface:
        class: BytesCommerce\ZabbixApi\ZabbixClient
        arguments:
            $cache: '@cache.app'
            $username: '%zabbix_api.username%'
            $password: '%zabbix_api.password%'
            $authTtl: '%zabbix_api.auth_ttl%'

    BytesCommerce\ZabbixApi\ZabbixServiceInterface:
        class: BytesCommerce\ZabbixApi\ZabbixService

    BytesCommerce\ZabbixApi\ActionServiceInterface:
        class: BytesCommerce\ZabbixApi\ActionService

    BytesCommerce\ZabbixApi\Contract\ZabbixNamingProviderInterface:
        class: BytesCommerce\ZabbixApi\Service\ZabbixNaming

    BytesCommerce\ZabbixApi\Contract\ZabbixClientWithApiKeyInterface:
        class: BytesCommerce\ZabbixApi\Service\ZabbixClientWithApiKey
        arguments:
            $httpClient: '@zabbix.http_client'
            $cache: '@cache.app'

    BytesCommerce\ZabbixApi\Contract\ZabbixClientWrapperInterface:
        class: BytesCommerce\ZabbixApi\Service\ZabbixClientWrapper

    BytesCommerce\ZabbixApi\Contract\ItemDefinitionProviderInterface:
        class: BytesCommerce\ZabbixApi\Service\ZabbixItemRegistry
        arguments:
            $cache: '@cache.app'

    BytesCommerce\ZabbixApi\Contract\ZabbixSenderInterface:
        class: BytesCommerce\ZabbixApi\Setup\ZabbixSender

    BytesCommerce\ZabbixApi\Contract\ZabbixSetupInterface:
        class: BytesCommerce\ZabbixApi\Setup\ZabbixSetup

    BytesCommerce\ZabbixApi\Contract\DashboardApiInterface:
        class: BytesCommerce\ZabbixApi\Provisioning\DashboardApi

    BytesCommerce\ZabbixApi\Contract\DefinitionLoaderInterface:
        class: BytesCommerce\ZabbixApi\Provisioning\DefinitionLoader

    BytesCommerce\ZabbixApi\Contract\DashboardProvisionerInterface:
        class: BytesCommerce\ZabbixApi\Provisioning\DashboardProvisioner
